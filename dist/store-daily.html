<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さんわ店頭日報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
:root{
  --ground:#f6fafb;--surface:#ffffff;--surface-2:#eff4f6;--line:#dce7eb;--line-strong:#c2cdd8;
  --ink:#0c2142;--ink-2:#596f8e;--ink-3:#8193a4;--accent:#0798a6;--accent-2:#10b9b3;--accent-ink:#ffffff;
  --accent-soft:#d9f4f4;--accent-mid:#7fd1d6;--ok:#07906a;--ok-soft:#d9f8ec;
  --warn:#94600f;--warn-soft:#fbefd9;--down:#ee5b43;--up:#07906a;
  --shadow:0 -1px 0 rgba(20,75,95,.05),0 -12px 28px rgba(20,75,95,.08);
  --card-shadow:0 1px 2px rgba(22,75,91,.04),0 8px 20px rgba(22,75,91,.05);
  --r:17px;--r-sm:12px;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d141b;--surface:#151f29;--surface-2:#1a2632;--line:#263543;--line-strong:#36495c;
    --ink:#e5ecf2;--ink-2:#a3b0bc;--ink-3:#768492;--accent:#5fd3d6;--accent-2:#7fe0d3;--accent-ink:#0d141b;
    --accent-soft:#123338;--accent-mid:#2f6b6f;--ok:#6cc39a;--ok-soft:#14302a;--warn:#e2ad55;
    --warn-soft:#342812;--down:#ee8f80;--up:#6cc39a;--shadow:0 -1px 0 #263543;
    --card-shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35);color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:"Barlow Semi Condensed","Noto Sans JP",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:0 180px;display:flex;flex-direction:column;gap:16px}

/* header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;margin:0 -16px;background:color-mix(in srgb, var(--ground) 90%, transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-main{display:flex;align-items:center;gap:8px;min-width:0}
.brand{font-size:15px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap;flex:none}
.pill.mono{background:var(--accent-soft);color:var(--accent)}

/* who / date / pickers */
.who{display:flex;flex-direction:column;gap:10px}
.date{font-size:26px;font-weight:700;line-height:1.15;letter-spacing:.01em}
.date span{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:4px}
.picks{display:flex;gap:10px}
.pick{flex:1;display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.03em}
.pick select{height:46px;min-width:0;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);font-size:15px;font-weight:600;color:var(--ink)}
.pick-count{height:46px;min-width:0;width:100%;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);font-size:15px;font-weight:600}

/* cards / groups */
.group{background:var(--surface);border-radius:var(--r);padding:4px 16px 14px;box-shadow:var(--card-shadow)}
.gh{margin:0;padding:16px 0 4px;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.01em;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;text-wrap:balance}
.gh small{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.hint{margin:0 2px 2px;font-size:13px;color:var(--ink-2)}
.sub{margin:0;font-size:13px;color:var(--ink-2)}

/* rows / steppers */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-top:1px solid var(--line)}
.lab{font-size:14.5px;display:flex;align-items:center;flex-wrap:wrap;gap:0 6px;line-height:1.35}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-2);flex:none}
.mk{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:5px;letter-spacing:.02em}
.ctr{display:flex;align-items:center;gap:4px;flex:none}
.sb{width:40px;height:40px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface-2);font-size:19px;line-height:1;display:grid;place-items:center;transition:transform .08s,background .12s}
.sb:active{transform:scale(.92);background:var(--accent-soft)}
.val{min-width:44px;text-align:center;font-size:24px;font-weight:600}
.row.total{min-height:52px}
.big{font-size:26px;font-weight:600;padding-right:44px}

/* mode switch */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;gap:4px;background:var(--surface-2);border-radius:var(--r-sm)}
.seg button{height:42px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:13.5px;color:var(--ink-2);transition:background .12s,color .12s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--card-shadow)}

/* yes/no */
.yn{display:flex;gap:6px}
.yn button{height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2);transition:transform .08s}
.yn button:active{transform:scale(.96)}
.yn button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}

/* section labels inside "この1組" */
.cl{margin:16px 0 0;padding:12px 0 8px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cl .step{font-size:12px;font-weight:700;color:var(--ink)}
.cl .rule{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em}
.cl .rule.one{background:var(--accent-soft);color:var(--accent)}
.cl .rule.many{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:14px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;transition:transform .08s,background .12s,border-color .12s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip[aria-pressed="true"] .dot{background:var(--accent-ink)}
.chips.won .chip[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}

/* buttons */
.primary{height:52px;padding:0 20px;border:0;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);font-size:15.5px;font-weight:700;transition:transform .08s,opacity .15s}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.4;cursor:not-allowed}
.wide{width:100%;margin:6px 0 12px}
.badge{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:999px}

/* today's log list */
.logs{list-style:none;margin:0;padding:0}
.logs li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.logs .t{font-size:15px;font-weight:700;color:var(--ink-2);line-height:1.6}
.lg{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);line-height:1.5}
.tag.won{background:var(--ok-soft);color:var(--ok);font-weight:700}
.tag.muted{color:var(--ink-3)}
.link{border:0;background:none;padding:6px 2px;font-size:12.5px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.empty,.note-s{font-size:13px;color:var(--ink-3);margin:8px 0 4px;padding:18px 14px;border:1.5px dashed var(--line-strong);border-radius:var(--r-sm);text-align:center;background:var(--surface-2)}

textarea{width:100%;min-height:84px;margin:6px 0 12px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface-2);font-size:15px;resize:vertical}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600}
.foot{font-size:11.5px;color:var(--ink-3);text-align:center;margin:2px 0 0}

/* send bar */
.sendbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));background:var(--surface);box-shadow:var(--shadow);padding:12px 16px;border-top:1px solid var(--line)}
.sendbar[hidden]{display:none!important}
.sb-in{max-width:460px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sum{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.sum b{font-size:20px;font-weight:700;color:var(--ink);margin-right:1px}
.st{display:block;font-size:11.5px;margin-top:2px;color:var(--ink-3)}
.st.ok{color:var(--ok);font-weight:700}
.st.bad{color:var(--warn);font-weight:700}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabbar button{height:64px;border:0;background:none;font-size:12.5px;font-weight:700;color:var(--ink-3);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:color .12s}
.tabbar button small{font-size:10px;font-weight:500}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.banner{font-size:13px;color:var(--ink-2);background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:var(--r-sm);padding:12px 14px}
.banner.mgr{background:var(--accent-soft);border:1px solid transparent;color:var(--accent);font-weight:600}
.sec-t{margin:2px 2px 0;font-size:19px;font-weight:700;line-height:1.35;text-wrap:balance}

/* KPI cards */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--card-shadow)}
.kl{font-size:12px;font-weight:700;color:var(--ink-2);line-height:1.4}
.kv{font-size:34px;font-weight:700;line-height:1.1;margin-top:4px;color:var(--accent)}
.kv small{font-size:15px;font-weight:600;margin-left:2px;color:var(--ink-2)}
.kp{font-size:12.5px;color:var(--ink-2)}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--ink-3)}
.kf{font-size:10.5px;color:var(--ink-3);margin-top:4px}

.bars{display:flex;flex-direction:column;gap:10px;padding:4px 0 14px}
.bar-row{display:grid;grid-template-columns:80px 1fr 60px;gap:10px;align-items:center}
.bl{font-size:11.5px;color:var(--ink-2)}
.track{height:14px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.fill{height:100%;background:var(--accent-mid);border-radius:8px;overflow:hidden}
.inner{height:100%;background:var(--accent)}
.bv{font-size:16px;font-weight:600;text-align:right}

.pt,.cmp{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:6px}
.pt th,.pt td,.cmp th,.cmp td{padding:10px 0;border-top:1px solid var(--line);text-align:left;font-weight:500}
.pt thead th,.cmp thead th{font-size:11.5px;color:var(--ink-3);font-weight:700;border-top:0;padding-top:0}
.r{text-align:right!important}
.flag,.worst{font-size:10.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:1px 7px;border-radius:5px}

.days{list-style:none;margin:0;padding:0}
.days li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
.state{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.state.ok{background:var(--ok-soft);color:var(--ok)}
.state.no{background:var(--warn-soft);color:var(--warn)}

.people{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 0 14px}
.person{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;border-radius:var(--r-sm);background:var(--surface-2);font-size:13.5px}
.copy{display:grid;grid-template-columns:1fr auto;gap:0 12px;margin:0;padding:0 0 12px}
.copy dt,.copy dd{margin:0;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.copy dd{text-align:right;font-size:18px;font-weight:700;color:var(--accent)}
@media (max-width:380px){.kpis,.people{grid-template-columns:1fr}.bar-row{grid-template-columns:66px 1fr 54px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-main">
      <span class="brand">店頭日報</span>
      <span class="pill">サンプル</span>
    </div>
    <span class="pill mono num" id="voicePill">音声 0件</span>
  </header>
  <div class="who">
    <div class="date" id="date"></div>
    <div class="picks">
      <label class="pick" for="store">店舗
        <select id="store" aria-label="店舗"></select>
      </label>
      <label class="pick" for="person">入力する人
        <select id="person"></select>
      </label>
    </div>
  </div>
  <main id="panel"></main>
</div>

<div class="sendbar" id="sendbar">
  <div class="sb-in">
    <div class="sum">
      <div>接客 <b class="num" data-count="visits">0</b>組 提案 <b class="num" data-count="proposedGroups">0</b>組 決まった <b class="num" data-count="wonTotal">0</b>件</div>
      <span class="st" id="sendstate">まだ送っていません</span>
    </div>
    <button type="button" class="primary" id="send">今日の分を送る</button>
  </div>
</div>

<nav class="tabbar" aria-label="画面の切り替え">
  <div class="in">
    <button type="button" id="tab-input" data-tab="input">入力する<small>毎日</small></button>
    <button type="button" id="tab-me" data-tab="me">自分の記録<small>本人と店長だけ</small></button>
    <button type="button" id="tab-store" data-tab="store">店長<small>店全体・週1回</small></button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var STORE_KEY = "sanwa-nippo-mock-v1";
  var VOICE_SUMMARY_KEY = "sanwa-voice-summary-v1";
  var STAFF = [
    {id:"sato", name:"佐藤 美咲"},
    {id:"tanaka", name:"田中 健"},
    {id:"yamamoto", name:"山本 さくら"},
    {id:"murata", name:"村田 店長"}
  ];
  var STORES = [
    {id:"gakuen", name:"学園北店"},
    {id:"aeon", name:"イオン松江店"},
    {id:"mitoya", name:"三刀屋店"}
  ];
  var VISIT = [["mnp_new","MNP/新規",0],["kihen","機変",0],["au_uq","au⇔UQ",0],["keihen","契変",0],["sousa","操作",0],["koshou","故障",0],["kaiyaku","解約",0],["tsukisoi","付き添い",0],["other","その他",0]];
  var PROP = [["o60","O60",1],["u18","U18",1],["money","マネ活",1],["ftth","FTTH",1],["denki","でんき",0],["card","カード",0],["plus1","＋１",0],["cellup","セルアップ",0]];
  var WON = [["mnp","MNP",1,1],["new","新規",1,1],["kihen","機変",0,1],["uq_au","UQ→au",1,1],["other","その他",0,1],["yoyaku","予約のみ",0,0],["none","成約なし",0,0]];
  var ATTACH = [["o60","O60",1],["u18","U18",1],["money","マネ活",1],["ftth","FTTH",1],["denki","でんき",0],["gold","ゴールド",0],["silver","シルバー",0],["jigin","じ銀",0],["plus1","＋１",0],["setup","設定サポ",0]];
  var ENTRY = [["visits","接客した組数","①の元"],["used","診断シートを使った組数",""],["proposedGroups","提案した組数","②の元"]];
  var EXTRA = [["google","Google 口コミ"],["meishi","名刺"],["cp","紹介CP"],["coupon","クーポン"]];
  var KEYS = ENTRY.map(function(e){return e[0];}).concat(PROP.map(function(p){return "prop_"+p[0];})).concat(WON.map(function(w){return "won_"+w[0];})).concat(ATTACH.map(function(a){return "attach_"+a[0];})).concat(EXTRA.map(function(e){return e[0];}));
  var WD = ["日","月","火","水","木","金","土"];
  var TODAY = new Date(); TODAY.setHours(12,0,0,0);
  function empty(){var t={};KEYS.forEach(function(k){t[k]=0;});return t;}
  function add(a,b){KEYS.forEach(function(k){a[k]+=(b[k]||0);});return a;}
  function wonTotal(t){return WON.reduce(function(s,w){return w[3]?s+t["won_"+w[0]]:s;},0);}
  function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function daysAgo(n){var d=new Date(TODAY);d.setDate(d.getDate()-n);return d;}
  function md(d){return (d.getMonth()+1)+"/"+d.getDate();}
  function range(from,to){return md(daysAgo(from))+"〜"+md(daysAgo(to));}
  function hhmm(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function pct(x){return Math.round(x*100)+"%";}
  function f2(x){return x.toFixed(2);}
  function labV(k){var v=VISIT.find(function(x){return x[0]===k;});return v?v[1]:k;}
  function labP(k){var p=PROP.find(function(x){return x[0]===k;});return p?p[1]:k;}
  function labW(k){var w=WON.find(function(x){return x[0]===k;});return w?w[1]:k;}
  function labA(k){var a=ATTACH.find(function(x){return x[0]===k;});return a?a[1]:k;}
  function freshDraft(){return {used:true,count:1,visit:null,prop:[],won:null,attach:[]};}
  function sampleToday(){
    return {
      sato:{logs:[{t:"11:08",used:true,count:1,prop:["cellup","card"],won:"kihen",attach:["gold"]},{t:"12:40",used:true,count:2,prop:["ftth","money"],won:"new",attach:["ftth","o60"]},{t:"15:52",used:true,count:1,prop:["o60","u18"],won:"mnp",attach:[]}],adj:{google:2,cp:1},note:"引越しの話から、自然にひかりの話を出せた",submitted:false,submittedAt:"",changed:false},
      tanaka:{logs:[],adj:{visits:8,used:6,proposedGroups:5,prop_u18:2,prop_money:2,won_uq_au:1,google:2},note:"",submitted:true,submittedAt:"20:12",changed:false},
      yamamoto:{logs:[],adj:{visits:5,used:3,proposedGroups:2,prop_cellup:2,won_kihen:1},note:"",submitted:false,submittedAt:"",changed:false},
      murata:{logs:[],adj:{visits:4,used:4,proposedGroups:3,prop_ftth:2,won_new:1},note:"",submitted:true,submittedAt:"19:48",changed:false}
    };
  }
  function fresh(){return {v:1,date:dkey(TODAY),person:"sato",store:"gakuen",mode:"log",tab:"input",viewPerson:null,today:sampleToday(),draft:freshDraft()};}
  function normalizeLog(l){
    var won=l.won;
    if(Array.isArray(won))won=won.length?won[0]:null;else if(won===undefined)won=null;
    return {t:l.t,used:!!l.used,count:l.count||1,visit:(l.visit!==undefined?l.visit:null),prop:l.prop||[],won:won,attach:l.attach||[]};
  }
  function load(){try{var raw=localStorage.getItem(STORE_KEY);if(raw){var s=JSON.parse(raw);if(s&&s.v===1&&s.date===dkey(TODAY)&&s.today){s.draft=Object.assign(freshDraft(),s.draft||{});Object.keys(s.today).forEach(function(pid){if(s.today[pid]&&s.today[pid].logs)s.today[pid].logs=s.today[pid].logs.map(normalizeLog);});return Object.assign(fresh(),s);}}}catch(e){}return fresh();}
  function notifyLinkedDashboard(){
    try{window.parent.postMessage({type:"sanwa:nippo-updated"},"*");}catch(e){}
  }
  function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));notifyLinkedDashboard();}catch(e){}}
  var state=load();
  function todayTotals(pid){
    var d=state.today[pid], t=empty();
    d.logs.forEach(function(l){t.visits++;if(l.used)t.used++;if(l.prop.length)t.proposedGroups++;l.prop.forEach(function(k){t["prop_"+k]++;});if(l.won)t["won_"+l.won]++;l.attach.forEach(function(k){t["attach_"+k]++;});});
    Object.keys(d.adj).forEach(function(k){if(k in t)t[k]+=d.adj[k];});
    return t;
  }
  function chip(set,p,on){return '<button type="button" class="chip" data-chip="'+set+':'+p[0]+'" aria-pressed="'+on+'">'+(p[2]?'<span class="dot"></span>':'')+p[1]+'</button>';}
  function stepRow(key,label,mark,isKey){return '<div class="row"><span class="lab">'+(isKey?'<span class="dot"></span>':'')+label+(mark?'<span class="mk">'+mark+'</span>':'')+'</span><div class="ctr"><button type="button" class="sb" data-step="'+key+'" data-d="-1">−</button><span class="num val" data-count="'+key+'">0</span><button type="button" class="sb" data-step="'+key+'" data-d="1">＋</button></div></div>';}
  function group(title,inner,small){return '<section class="group"><h2 class="gh">'+title+(small?'<small>'+small+'</small>':'')+'</h2>'+inner+'</section>';}
  function cl(no,label,rule){return '<div class="cl"><span class="step">'+no+' '+label+'</span><span class="rule '+(rule==="one"?"one":"many")+'">'+(rule==="one"?"1つだけ選ぶ":"いくつでも選べる")+'</span></div>';}
  function composer(){
    var dr=state.draft;
    return '<section class="group"><h2 class="gh">この1組<small>接客が終わったら30秒で</small></h2>'
      +'<div class="row"><span class="lab">① 診断シートを使った</span><div class="yn"><button type="button" data-used="1" aria-pressed="'+dr.used+'">使った</button><button type="button" data-used="0" aria-pressed="'+(!dr.used)+'">使っていない</button></div></div>'
      +'<div class="row"><span class="lab">② 一組あたりの来店者数</span><select class="pick-count" data-dsel="count">'+[1,2,3,4,5,6].map(function(n){return '<option value="'+n+'"'+(dr.count===n?' selected':'')+'>'+n+'人</option>';}).join("")+'</select></div>'
      +cl("③","ご来店内容","one")+'<div class="chips visit">'+VISIT.map(function(v){return chip("visit",v,dr.visit===v[0]);}).join("")+'</div>'
      +cl("④","提案内容","many")+'<div class="chips prop">'+PROP.map(function(p){return chip("prop",p,dr.prop.indexOf(p[0])>=0);}).join("")+'</div>'
      +cl("⑤","成約内容","one")+'<div class="chips won">'+WON.map(function(w){return chip("won",w,dr.won===w[0]);}).join("")+'</div>'
      +cl("⑥","付帯内容","many")+'<div class="chips attach">'+ATTACH.map(function(a){return chip("attach",a,dr.attach.indexOf(a[0])>=0);}).join("")+'</div>'
      +'<button type="button" class="primary wide" data-act="addlog">この1組を記録する</button></section>';
  }
  function logList(d){
    var items=d.logs.slice().reverse().map(function(l,i){var idx=d.logs.length-1-i;return '<li><span class="t num">'+l.t+'</span><div class="lg">'+'<span class="tag">'+l.count+'人</span>'+(l.visit?'<span class="tag">来店 '+labV(l.visit)+'</span>':'')+(l.prop.length?'<span class="tag">提案 '+l.prop.map(labP).join("・")+'</span>':'<span class="tag muted">提案なし</span>')+(l.won?'<span class="tag won">成約 '+labW(l.won)+'</span>':'<span class="tag muted">成約内容なし</span>')+(l.attach.length?'<span class="tag">付帯 '+l.attach.map(labA).join("・")+'</span>':'')+(l.used?'':'<span class="tag muted">シート未使用</span>')+'</div><button type="button" class="link" data-del="'+idx+'">取り消す</button></li>';}).join("");
    return '<section class="group"><h2 class="gh">きょうの記録<span class="badge num">'+d.logs.length+'組</span></h2>'+(items?'<ol class="logs">'+items+'</ol>':'<p class="empty">まだ記録がありません。接客が終わったら、上で記録します。</p>')+'</section>';
  }
  function bulk(){return group("入口",ENTRY.map(function(e){return stepRow(e[0],e[1],e[2],0);}).join(""),"閉店後に○を数えて入れる")+group("提案内容の数",PROP.map(function(p){return stepRow("prop_"+p[0],p[1],"",p[2]);}).join(""),"● いま特に伸ばしたい商材")+group("成約内容の数",WON.map(function(w){return stepRow("won_"+w[0],w[1],"",w[2]);}).join("")+'<div class="row total"><span class="lab">成約内容の合計<span class="mk">③の元</span></span><span class="num big" data-count="wonTotal">0</span></div>')+group("付帯内容の数",ATTACH.map(function(a){return stepRow("attach_"+a[0],a[1],"",a[2]);}).join(""));}
  function renderInput(){
    var d=state.today[state.person], log=state.mode==="log";
    panel.innerHTML='<div style="display:flex;flex-direction:column;gap:14px"><div class="seg"><button type="button" data-mode="log" aria-pressed="'+log+'">1組ずつ記録</button><button type="button" data-mode="bulk" aria-pressed="'+(!log)+'">まとめて入力</button></div><p class="hint">'+(log?"接客が終わるたびに、その場で30秒。":"閉店後に、診断シートの店舗記入欄の○を数えて入れます。")+'</p>'+(log?composer()+logList(d):bulk())+group("配布数",EXTRA.map(function(e){return stepRow(e[0],e[1],"",0);}).join(""))+'<section class="group"><h2 class="gh">ひとこと<small>今日うまくいった接客（任意）</small></h2><textarea id="note" rows="3">'+esc(d.note)+'</textarea></section><p class="foot">表示されている名前と数字はすべてサンプルです。<button type="button" class="link" data-act="reset">サンプルに戻す</button></p></div>';
    updateCounts();
  }
  function renderMe(){
    var pid=state.person,t=todayTotals(pid), rate=t.visits?t.proposedGroups/t.visits:0, close=t.proposedGroups?wonTotal(t)/t.proposedGroups:0;
    panel.innerHTML='<div style="display:flex;flex-direction:column;gap:14px"><div class="banner">この画面は、本人と店長だけが見られます。</div><h2 class="sec-t">今日の自分の記録</h2><div class="kpis"><div class="kpi"><div class="kl">② 提案した組の割合</div><div class="kv num">'+Math.round(rate*100)+'<small>%</small></div><div class="kf">提案した組数 ÷ 接客した組数</div></div><div class="kpi"><div class="kl">③ 提案1組あたりの決まった数</div><div class="kv num">'+f2(close)+'<small>件</small></div><div class="kf">決まった数 ÷ 提案した組数</div></div></div>'+group("最近7日の送信",'<ul class="days"><li><span>今日</span><span class="state '+(state.today[pid].submitted?'ok':'no')+'">'+(state.today[pid].submitted?'送信済み':'未送信')+'</span></li><li><span>昨日</span><span class="state ok">送信済み</span></li><li><span>2日前</span><span class="state ok">送信済み</span></li></ul>')+'</div>';
  }
  function renderStore(){
    var total=empty();STAFF.forEach(function(p){add(total,todayTotals(p.id));});
    panel.innerHTML='<div style="display:flex;flex-direction:column;gap:14px"><div class="banner">店長だけに表示する画面です。</div><h2 class="sec-t">今週の3つの数字</h2>'+group("店全体",'<table class="cmp"><tbody><tr><th>① 来店組数</th><td class="r num">'+total.visits+'組</td></tr><tr><th>② 提案した組の割合</th><td class="r num">'+pct(total.visits?total.proposedGroups/total.visits:0)+'</td></tr><tr><th>③ 提案1組あたりの決まった数</th><td class="r num">'+f2(total.proposedGroups?wonTotal(total)/total.proposedGroups:0)+'件</td></tr></tbody></table>')+group("今日の送信",'<div class="people">'+STAFF.map(function(p){var d=state.today[p.id];return '<div class="person"><span>'+esc(p.name)+'</span><span class="state '+(d.submitted?'ok':'no')+'">'+(d.submitted?'送信済み '+d.submittedAt:'まだ')+'</span></div>';}).join("")+'</div>')+group("ふり返りシートに写す値",'<dl class="copy"><dt>接客した組数</dt><dd class="num">'+total.visits+'</dd><dt>提案した組数</dt><dd class="num">'+total.proposedGroups+'</dd><dt>決まった数の合計</dt><dd class="num">'+wonTotal(total)+'</dd></dl>')+'</div>';
  }
  function updateCounts(){
    var t=todayTotals(state.person), d=state.today[state.person];
    document.querySelectorAll("[data-count]").forEach(function(el){var k=el.dataset.count;el.textContent=k==="wonTotal"?wonTotal(t):t[k];});
    var st=document.getElementById("sendstate"), btn=document.getElementById("send");
    btn.textContent=d.submitted?"直して送り直す":"今日の分を送る";
    st.textContent=d.submitted?(d.changed?"送ったあとに直した分は、まだ届いていません":"送信済み "+d.submittedAt):"まだ送っていません";
    st.className=d.submitted&&!d.changed?"st ok":(d.changed?"st bad":"st");
  }
  function refreshVoiceStat(){
    var el=document.getElementById("voicePill");
    if(!el)return;
    try{
      var raw=localStorage.getItem(VOICE_SUMMARY_KEY);
      var s=raw?JSON.parse(raw):null;
      var todayCount=(s&&s.date===dkey(TODAY))?s.todayCount:0;
      el.textContent="音声 本日"+todayCount+"件";
    }catch(e){el.textContent="音声 0件";}
  }
  var panel=document.getElementById("panel");
  function render(){
    var dt=TODAY;
    document.getElementById("date").innerHTML=(dt.getMonth()+1)+"月"+dt.getDate()+"日<span>（"+WD[dt.getDay()]+"）</span>";
    var sel=document.getElementById("person");
    if(!sel.options.length)sel.innerHTML=STAFF.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join("");
    sel.value=state.person;
    var storeSel=document.getElementById("store");
    if(!storeSel.options.length)storeSel.innerHTML=STORES.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>';}).join("");
    storeSel.value=state.store;
    ["input","me","store"].forEach(function(t){var b=document.getElementById("tab-"+t);if(state.tab===t)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
    document.getElementById("sendbar").hidden=state.tab!=="input";
    if(state.tab==="input")renderInput();else if(state.tab==="me")renderMe();else renderStore();
    updateCounts();
    refreshVoiceStat();
  }
  function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(function(){el.classList.remove("show");},1600);}
  function stamp(d){if(d.submitted)d.changed=true;}
  document.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;var d=state.today[state.person];
    if(b.dataset.tab){state.tab=b.dataset.tab;save();render();scrollTo(0,0);return;}
    if(b.dataset.mode){state.mode=b.dataset.mode;save();renderInput();return;}
    if(b.dataset.used){state.draft.used=b.dataset.used==="1";renderInput();return;}
    if(b.dataset.chip){
      var p=b.dataset.chip.split(":"), set=p[0], k=p[1];
      if(set==="visit"||set==="won"){state.draft[set]=(state.draft[set]===k)?null:k;renderInput();return;}
      var arr=state.draft[set], i=arr.indexOf(k);
      if(i>=0)arr.splice(i,1);else arr.push(k);
      renderInput();return;
    }
    if(b.dataset.act==="addlog"){var dr=state.draft;d.logs.push({t:hhmm(new Date()),used:dr.used,count:dr.count,visit:dr.visit,prop:dr.prop.slice(),won:dr.won,attach:dr.attach.slice()});stamp(d);state.draft=freshDraft();save();renderInput();toast("1組を記録しました");return;}
    if(b.dataset.del!==undefined){d.logs.splice(Number(b.dataset.del),1);stamp(d);save();renderInput();return;}
    if(b.dataset.step){var key=b.dataset.step, cur=todayTotals(state.person)[key], nv=Math.max(0,cur+Number(b.dataset.d));if(nv!==cur){d.adj[key]=(d.adj[key]||0)+(nv-cur);stamp(d);save();}updateCounts();return;}
    if(b.id==="send"){d.submitted=true;d.changed=false;d.submittedAt=hhmm(new Date());save();updateCounts();toast("送信しました");return;}
    if(b.dataset.act==="reset"){state=fresh();save();render();return;}
  });
  document.addEventListener("change",function(e){
    if(e.target.id==="person"){state.person=e.target.value;state.draft=freshDraft();save();render();return;}
    if(e.target.id==="store"){state.store=e.target.value;save();render();return;}
    if(e.target.dataset.dsel){state.draft[e.target.dataset.dsel]=Number(e.target.value);return;}
  });
  document.addEventListener("input",function(e){if(e.target.id==="note"){var d=state.today[state.person];d.note=e.target.value;stamp(d);save();updateCounts();}});
  window.addEventListener("storage",function(e){if(e.key===VOICE_SUMMARY_KEY)refreshVoiceStat();});
  window.addEventListener("message",function(e){if(e.data&&e.data.type==="sanwa:voice-updated")refreshVoiceStat();});
  render();
})();
</script>
</body>
</html>
